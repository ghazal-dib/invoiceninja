name: phpunit

on:
  push:
    branches: [ main, v5-stable ]
  pull_request:
    branches: [ main, v5-stable ]

jobs:
  run:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.3' ]
        dependency-version: [ prefer-stable ]

    env:
      # إعدادات Laravel العامة
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      BROADCAST_DRIVER: log
      MAIL_MAILER: log
      NINJA_ENVIRONMENT: hosted
      MULTI_DB_ENABLED: false
      PDF_GENERATOR: hosted_ninja

      # قاعدة البيانات (سنأخذ المنفذ من خدمة mariadb)
      DB_CONNECTION: mysql
      DB_DATABASE: ninja
      DB_USERNAME: ninja
      DB_PASSWORD: ninja
      DB_HOST: 127.0.0.1

      # Redis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_DATABASE: ninja
          MYSQL_USER: ninja
          MYSQL_PASSWORD: ninja
          MYSQL_ROOT_PASSWORD: ninja
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pninja"
          --health-interval=10s --health-timeout=5s --health-retries=5

      redis:
        image: redis:7-alpine
        ports:
          - 6379/tcp
        options: >-
          --health-cmd="redis-cli ping || exit 1"
          --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # لا نحدد ref لفرع غير موجود؛ نأخذ فرع الـ PR/commit تلقائيًا

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: >-
            pdo_mysql, mysqli, sqlite3, intl, bcmath, gmp,
            gd, curl, zip, mbstring, xml, redis, pcntl
          coverage: none

      - name: Wait for database to be ready
        env:
          DB_PORT: ${{ job.services.mariadb.ports[3306] }}
        run: |
          echo "MariaDB port is $DB_PORT"
          for i in {1..30}; do
            if mysqladmin ping -h"127.0.0.1" -P"$DB_PORT" -pninja --silent; then
              echo "MariaDB is up!"
              exit 0
            fi
            echo "Waiting for MariaDB... ($i)"
            sleep 2
          done
          echo "MariaDB did not become ready in time"; exit 1

      - name: Export dynamic ports to env
        run: |
          echo "DB_PORT=${{ job.services.mariadb.ports[3306] }}" >> $GITHUB_ENV
          echo "REDIS_PORT=${{ job.services.redis.ports[6379] }}" >> $GITHUB_ENV

      - name: Prepare .env (testing)
        run: |
          if [ -f .env.ci ]; then cp .env.ci .env; else cp .env.example .env; fi
          php -r "file_exists('.env') || copy('.env.example','.env');"
          sed -i "s/^DB_HOST=.*/DB_HOST=127.0.0.1/" .env
          sed -i "s/^DB_DATABASE=.*/DB_DATABASE=ninja/" .env
          sed -i "s/^DB_USERNAME=.*/DB_USERNAME=ninja/" .env
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=ninja/" .env
          sed -i "s/^DB_PORT=.*/DB_PORT=${DB_PORT}/" .env
          sed -i "s/^REDIS_HOST=.*/REDIS_HOST=127.0.0.1/" .env
          sed -i "s/^REDIS_PORT=.*/REDIS_PORT=${REDIS_PORT}/" .env

      - name: Composer install
        env:
          COMPOSER_NO_INTERACTION: 1
          COMPOSER_PROCESS_TIMEOUT: 0
        run: |
          composer install --no-interaction --prefer-dist

      - name: Laravel app warmup
        run: |
          php artisan key:generate --force || true
          php artisan config:clear
          php artisan optimize
          php artisan ninja:post-update || true

      - name: Run migrations & seeds
        run: |
          php artisan migrate --force
          php artisan db:seed --force || true

      - name: Run PHPUnit
        env:
          DB_PORT: ${{ env.DB_PORT }}
          REDIS_PORT: ${{ env.REDIS_PORT }}
          PHP_CS_FIXER_IGNORE_ENV: true
        run: |
          if [ -f vendor/bin/phpunit ]; then
            vendor/bin/phpunit --testdox
          else
            echo "phpunit not found"; exit 1
          fi
